name: Okada Online V4 Verification

on:
  push:
    branches:
      - v4-mobility-os
  pull_request:
    branches:
      - v4-mobility-os
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests + deployment structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Validate Functions package
        run: |
          node -e "const p=require('./package.json'); if(p.main!=='v4Entry.js') process.exit(1); if(p.engines?.node!=='20') process.exit(1); console.log('main=',p.main,'node=',p.engines.node)"

      - name: Validate Firebase deployment structure
        working-directory: backend
        run: |
          node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync('firebase.json','utf8')); if(f.functions?.source!=='functions') process.exit(1); if(f.functions?.runtime!=='nodejs20') process.exit(1); if(f.firestore?.rules!=='firestore.rules') process.exit(1); if(f.firestore?.indexes!=='firestore.indexes.json') process.exit(1); console.log('firebase.json structure OK')"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8')); console.log('firestore.indexes.json valid JSON')"

      - name: Check forbidden legacy payment/auth artifacts
        run: |
          set -e
          if grep -RniE 'require\([[:space:]]*[\"\047]twilio[\"\047][[:space:]]*\)|from[[:space:]]+[\"\047]twilio[\"\047]|import\([[:space:]]*[\"\047]twilio[\"\047][[:space:]]*\)' . --exclude-dir=node_modules --exclude='package-lock.json' --exclude='*.bak*'; then
            echo 'Forbidden Twilio runtime import detected'
            exit 1
          fi
          if grep -RniE 'process\.env\.GROQ_API_KEY|GROQ_API_KEY[[:space:]]*=|sk_(live|test)_[A-Za-z0-9]+' . --exclude-dir=node_modules --exclude='package-lock.json' --exclude='*.bak*'; then
            echo 'Forbidden runtime secret artifact detected'
            exit 1
          fi
          if find . -type f -name '*.js' ! -path './node_modules/*' ! -name '*.bak*' -print0 | xargs -0 grep -nH -E 'functions\\.config\\(' ; then
            echo 'Deprecated functions.config() usage detected'
            exit 1
          fi
          node -e "const p=require('./package.json'); for (const d of [p.dependencies,p.devDependencies]) if (d && Object.prototype.hasOwnProperty.call(d,'twilio')) process.exit(1);"
          echo 'Forbidden/deprecated runtime/provider artifact check passed'

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        env:
          CI: "false"
        run: npm run build
