name: Okada Online V4 Verification

on:
  push:
    branches:
      - v4-mobility-os
      - repair/**
  pull_request:
    branches:
      - v4-mobility-os
      - repair/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests + deployment structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22 for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Validate Functions package
        run: |
          node -e "const p=require('./package.json'); if(p.main!=='v4Entry.js') process.exit(1); if(p.engines?.node!=='22') process.exit(1); console.log('main=',p.main,'node=',p.engines.node)"

      - name: Validate Firebase deployment structure
        working-directory: backend
        run: |
          node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync('firebase.json','utf8')); if(f.functions?.source!=='functions') process.exit(1); if(f.functions?.runtime!=='nodejs22') process.exit(1); if(f.firestore?.rules!=='firestore.rules') process.exit(1); if(f.firestore?.indexes!=='firestore.indexes.json') process.exit(1); console.log('firebase.json structure OK')"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8')); console.log('firestore.indexes.json valid JSON')"

      - name: Self-test the deprecated-config guard
        run: bash ./scripts/check-deprecated-firebase-config.test.sh

      - name: Check forbidden legacy payment/auth artifacts
        run: |
          set -e
          if grep -RniE 'require\([[:space:]]*[\"\047]twilio[\"\047][[:space:]]*\)|from[[:space:]]+[\"\047]twilio[\"\047]|import\([[:space:]]*[\"\047]twilio[\"\047][[:space:]]*\)' . --exclude-dir=node_modules --exclude='package-lock.json' --exclude='*.bak*'; then
            echo 'Forbidden Twilio runtime import detected'
            exit 1
          fi
          if grep -RniE 'process\.env\.GROQ_API_KEY|GROQ_API_KEY[[:space:]]*=|sk_(live|test)_[A-Za-z0-9]+' . --exclude-dir=node_modules --exclude='package-lock.json' --exclude='*.bak*'; then
            echo 'Forbidden runtime secret artifact detected'
            exit 1
          fi
          bash ./scripts/check-deprecated-firebase-config.sh . || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            echo 'Deprecated-config guard found deprecated usage, or failed to run - failing the build (never a silent pass)'
            exit 1
          fi
          node -e "const p=require('./package.json'); for (const d of [p.dependencies,p.devDependencies]) if (d && Object.prototype.hasOwnProperty.call(d,'twilio')) process.exit(1);"
          echo 'Forbidden/deprecated runtime/provider artifact check passed'


  firestore-emulator-stress:
    name: Firestore Emulator concurrency stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22 for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install backend dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Run concurrent booking stress tests against Firestore Emulator
        run: >
          npx --yes firebase-tools@latest emulators:exec
          --only firestore
          --project demo-okada-stress
          --config backend/firebase.json
          "cd backend/functions && OKADA_FIRESTORE_EMULATOR=1 node --test modules/firestoreConcurrency.emulator.test.js"

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24 for Vercel frontend parity
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        env:
          CI: "false"
        run: npm run build


  mobile-expo-android-build:
    name: Expo Android build diagnostic (P0-D)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile app dependencies (project currently has no lockfile)
        working-directory: mobile-app
        run: npm install --legacy-peer-deps
      - name: Check Expo compatibility, bundle Android, prebuild and compile debug APK
        working-directory: mobile-app
        shell: bash
        run: |
          set +e
          npx expo install --check
          compatibility_status=$?
          npx expo export --platform android
          export_status=$?
          npx expo prebuild --platform android --no-install
          prebuild_status=$?
          native_status=125
          if [ "$prebuild_status" -eq 0 ] && [ -f android/gradlew ]; then
            chmod +x android/gradlew
            (cd android && ./gradlew assembleDebug)
            native_status=$?
          else
            echo "Android Gradle compilation could not run because Expo prebuild did not produce android/gradlew."
          fi
          echo "EXPO_COMPATIBILITY_STATUS=$compatibility_status"
          echo "ANDROID_BUNDLE_STATUS=$export_status"
          echo "EXPO_PREBUILD_STATUS=$prebuild_status"
          echo "ANDROID_DEBUG_BUILD_STATUS=$native_status"
          if [ "$compatibility_status" -ne 0 ] || [ "$export_status" -ne 0 ] || [ "$prebuild_status" -ne 0 ] || [ "$native_status" -ne 0 ]; then
            exit 1
          fi
